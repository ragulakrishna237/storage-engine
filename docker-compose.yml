# Pinned images (no `latest`). Postgres is published on 5434 because 5432 is
# often already taken on a developer machine. The leftover sandbox in
# postgres_sample/ still binds 5432; do not run both stacks at once if they
# would collide on 3306/6379.
services:
  mysql:
    image: mysql:8.0
    container_name: storage-engine-mysql
    environment:
      MYSQL_ROOT_PASSWORD: demo
      MYSQL_DATABASE: storage_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdemo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  postgres:
    image: postgres:16
    container_name: storage-engine-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: storage_demo
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d storage_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    container_name: storage-engine-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
